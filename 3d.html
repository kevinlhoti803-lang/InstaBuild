<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

  body { margin: 0; overflow: hidden; background: #0d0f0a; }
  #canvas3d { position: fixed; inset: 0; z-index: 1; cursor: grab; }
  #canvas3d:active { cursor: grabbing; }
  #canvas3d.placing { cursor: none; }

  .glass { background: rgba(20,24,10,0.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }

  #sidebar {
    position: fixed; top: 24px; left: 24px; z-index: 10;

    scrollbar-width: thin; scrollbar-color: rgba(75,83,32,0.3) transparent;

  .side-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-radius: 12px;
    border: 1px solid rgba(75,83,32,0.2);
    background: rgba(20,24,10,0.9); backdrop-filter: blur(12px);

  .side-btn.active { background: #4B5320; border-color: #4B5320; color: #fff; box-shadow: 0 0 16px rgba(75,83,32,0.35); }

  #infoBar {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 10;
    padding: 10px 24px; border-radius: 14px; border: 1px solid rgba(75,83,32,0.2);

  #toolbar {

  .tbtn:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .tbtn.active { background: #4B5320; color: #fff; border-color: #4B5320; box-shadow: 0 0 18px rgba(75,83,32,0.4); }
  .tbtn:disabled { opacity: 0.3; pointer-events: none; }
  .tsep { width: 1px; background: rgba(255,255,255,0.1); margin: 0 3px; }

  .snap-dot { position: fixed; pointer-events: none; z-index: 5; width: 14px; height: 14px; border-radius: 50%; background: rgba(184,200,118,0.9); border: 2px solid #B8C876; transform: translate(-50%,-50%); box-shadow: 0 0 14px rgba(184,200,118,0.45); display: none; }
</style>

  <button class="side-btn" data-tool="chair" data-mode="furnish">

    <span class="side-icon" style="background:rgba(75,83,32,0.4);">🛏</span>Bed
  </button>
  <button class="side-btn" data-tool="bookshelf" data-mode="furnish">
    <span class="side-icon" style="background:rgba(75,83,32,0.45);">📚</span>Bookshelf

  <div class="side-sep"></div>
  <div class="text-white/35 text-[11px] font-semibold uppercase tracking-wider px-1 pb-0">Kitchen</div>
  <button class="side-btn" data-tool="kitchen" data-mode="furnish">
    <span class="side-icon" style="background:rgba(75,83,32,0.3);">🍳</span>Kitchen Island

  <div class="side-sep"></div>

<!-- Info -->

  Click <span class="text-[#B8C876] font-bold">Draw Wall</span> to start &bull;

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

// ═══════════════════════════════════
//  GRID MATH
// ═══════════════════════════════════
class GridMath {
  constructor(s=0.5){this._s=s;}
  get size(){return this._s;}
  set size(v){this._s=Math.max(0.1,Math.min(5,v));}
  snap(v){return this._s*Math.round(v/this._s);}
  snapPt(x,z){return{x:this.snap(x),z:this.snap(z)};}
  snapV3(v){return new THREE.Vector3(this.snap(v.x),v.y,this.snap(v.z));}
  snap90(fx,fz,tx,tz){
    const dx=tx-fx,dz=tz-fz;
    return Math.abs(dx)>Math.abs(dz)?{x:this.snap(tx),z:fz}:{x:fx,z:this.snap(tz)};
  }
  nearest(x,z,cands,r=1.2){let b=null,bd=r;for(const c of cands){const d=Math.hypot(c.x-x,c.z-z);if(d<bd){bd=d;b=c;}}return b;}
}

// ═══════════════════════════════════
//  SCENE SETUP
// ═══════════════════════════════════
const canvas=document.getElementById('canvas3d');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;

const scene=new THREE.Scene();
scene.background=new THREE.Color('#1a1d12');
scene.fog=new THREE.Fog('#1a1d12',25,90);

const camera=new THREE.PerspectiveCamera(50,window.innerWidth/window.innerHeight,0.5,200);
camera.position.set(16,13,16);camera.lookAt(3,0,2);

const orbit=new OrbitControls(camera,renderer.domElement);
orbit.target.set(3,0,2);orbit.enableDamping=true;orbit.dampingFactor=0.08;
orbit.minDistance=3;orbit.maxDistance=60;orbit.maxPolarAngle=Math.PI/2.1;
orbit.mouseButtons={LEFT:THREE.MOUSE.ROTATE,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:THREE.MOUSE.PAN};
orbit.update();

// ── First-Person Tour Mode ──
const fpControls = new PointerLockControls(camera, renderer.domElement);
fpControls.enabled = false;
let tourActive = false;
const tourSpeed = 6;
const tourKeys = { w:false, a:false, s:false, d:false, shift:false };
const EYE_HEIGHT = 1.6;
const COLLISION_RADIUS = 0.4;

function startTour() {
  if (!walls.length) {
    infoBar.innerHTML = 'Build walls <span class="text-[#B8C876] font-bold">first</span> to tour inside!';
    return;
  }
  const b = bounds();
  const cx = (b.mnX + b.mxX) / 2, cz = (b.mnZ + b.mxZ) / 2;
  camera.position.set(cx, EYE_HEIGHT, cz);

  tourActive = true;
  fpControls.enabled = true;
  fpControls.lock();
  orbit.enabled = false;
  canvas.classList.remove('placing');
  document.querySelectorAll('.side-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btnTour').classList.add('active');
  infoBar.innerHTML = '<span class="text-[#B8C876] font-bold">WASD</span> move &bull; <span class="text-[#B8C876] font-bold">Mouse</span> look &bull; <span class="text-[#B8C876] font-bold">Esc</span> exit tour &bull; <span class="text-[#B8C876] font-bold">Shift</span> run';
}

function stopTour() {
  tourActive = false;
  fpControls.enabled = false;
  fpControls.unlock();
  orbit.enabled = true;
  camera.position.set(16, 13, 16);
  orbit.target.set(cx(), 0, cz());
  orbit.update();
  canvas.classList.add('placing');
  document.querySelectorAll('.side-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btnOrbit').classList.add('active');
  tool = 'orbit'; mode = '';
  infoBar.innerHTML = 'Tour ended. <span class="text-[#B8C876] font-bold">Left+drag</span> orbit &bull; Walls: <span class="text-[#B8C876] font-bold">' + walls.length + '</span>';
}

function checkCollision(pos) {
  const r = COLLISION_RADIUS;
  for (const w of walls) {
    const d = w.userData;
    const wx = d.endX - d.startX, wz = d.endZ - d.startZ;
    const wLen = Math.hypot(wx, wz);
    if (wLen < 0.01) continue;
    const ux = wx / wLen, uz = wz / wLen;
    const t = ((pos.x - d.startX) * ux + (pos.z - d.startZ) * uz) / wLen;
    const ct = Math.max(0, Math.min(1, t));
    const cx = d.startX + wx * ct, cz = d.startZ + wz * ct;
    const dist = Math.hypot(pos.x - cx, pos.z - cz);
    const minDist = r + WALL_T / 2;
    if (dist < minDist) {
      const nx = (pos.x - cx) / (dist || 0.001);
      const nz = (pos.z - cz) / (dist || 0.001);
      pos.x = cx + nx * minDist;
      pos.z = cz + nz * minDist;
    }
  }
}

window.addEventListener('keydown', ev => {
  if (!tourActive) return;
  const k = ev.key.toLowerCase();
  if (k in tourKeys) { tourKeys[k] = true; ev.preventDefault(); }
});
window.addEventListener('keyup', ev => {
  if (!tourActive) return;
  const k = ev.key.toLowerCase();
  if (k in tourKeys) { tourKeys[k] = false; ev.preventDefault(); }
  if (ev.key === 'Escape') stopTour();
});

fpControls.addEventListener('lock', () => { infoBar.innerHTML = '<span class="text-[#B8C876] font-bold">WASD</span> move &bull; <span class="text-[#B8C876] font-bold">Mouse</span> look &bull; <span class="text-[#B8C876] font-bold">Esc</span> exit &bull; <span class="text-[#B8C876] font-bold">Shift</span> run'; });
fpControls.addEventListener('unlock', () => { if (tourActive) stopTour(); });

function updateTour(dt) {
  if (!tourActive || !fpControls.isLocked) return;
  const speed = tourSpeed * (tourKeys.shift ? 1.7 : 1) * dt;
  const forward = new THREE.Vector3();
  camera.getWorldDirection(forward);
  forward.y = 0; forward.normalize();
  const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0,1,0)).normalize();

  if (tourKeys.w) { camera.position.addScaledVector(forward, speed); }
  if (tourKeys.s) { camera.position.addScaledVector(forward, -speed * 0.6); }
  if (tourKeys.a) { camera.position.addScaledVector(right, -speed * 0.7); }
  if (tourKeys.d) { camera.position.addScaledVector(right, speed * 0.7); }

  camera.position.y = EYE_HEIGHT;
  checkCollision(camera.position);
}

// ── Lighting ──
const ambient=new THREE.AmbientLight('#d8e0d0',1.3);scene.add(ambient);
const sun=new THREE.DirectionalLight('#fff8e8',4.5);sun.position.set(20,30,10);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near=0.5;sun.shadow.camera.far=100;
sun.shadow.camera.left=-40;sun.shadow.camera.right=40;
sun.shadow.camera.top=40;sun.shadow.camera.bottom=-40;sun.shadow.bias=-0.0002;
scene.add(sun);
const fill=new THREE.DirectionalLight('#b8c8b0',0.7);fill.position.set(-10,5,-5);scene.add(fill);
// Warm interior bounce light
const interiorFill=new THREE.DirectionalLight('#ffe8d0',1.0);interiorFill.position.set(0,2,0);scene.add(interiorFill);

const matGrass=new THREE.MeshStandardMaterial({color:'#4a5a30',roughness:0.85});

// Ground
const ground=new THREE.Mesh(new THREE.PlaneGeometry(50,50),matGrass);
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const gh=new THREE.GridHelper(50,100,'#3a4428','#2a3020');gh.position.y=0.01;scene.add(gh);

// ═══════════════════════════════════
//  MATERIALS — Professional Interior
// ═══════════════════════════════════
const WALL_H=3,WALL_T=0.4,EAVE=0.35;

// Exterior
const matWall=new THREE.MeshStandardMaterial({color:'#8B9A30',roughness:0.45,metalness:0.05});
const matFoundation=new THREE.MeshStandardMaterial({color:'#555',roughness:0.7});
const matRoofDark=new THREE.MeshStandardMaterial({color:'#5c3a24',roughness:0.45,metalness:0.05});
const matRoofTile=new THREE.MeshStandardMaterial({color:'#7a4030',roughness:0.5,metalness:0.06});
const matTrim=new THREE.MeshStandardMaterial({color:'#5a6028',roughness:0.5});
const matEave=new THREE.MeshStandardMaterial({color:'#f5f0e5',roughness:0.55});
const matPillar=new THREE.MeshStandardMaterial({color:'#7A8830',roughness:0.4,metalness:0.08});
const matWallBase=new THREE.MeshStandardMaterial({color:'#3a3a3a',roughness:0.55,metalness:0.05});
const matChimney=new THREE.MeshStandardMaterial({color:'#9b6a5a',roughness:0.6,metalness:0.02});
const matPath=new THREE.MeshStandardMaterial({color:'#8a8a80',roughness:0.7});

// Interior — premium palette
const matWallInner=new THREE.MeshStandardMaterial({color:'#F7F3EC',roughness:0.55,metalness:0.01}); // warm cream
const matFloor=new THREE.MeshStandardMaterial({color:'#C4A26C',roughness:0.4,metalness:0.02}); // rich oak
const matCeiling=new THREE.MeshStandardMaterial({color:'#F5F1EA',roughness:0.6,metalness:0.01}); // white ceiling
const matBaseboard=new THREE.MeshStandardMaterial({color:'#F0ECE5',roughness:0.45,metalness:0.02}); // white trim
const matCeilingBeam=new THREE.MeshStandardMaterial({color:'#D4C8B0',roughness:0.5,metalness:0.03}); // exposed beam

// Preview / ghost
const matPreview=new THREE.MeshStandardMaterial({color:'#B8C876',roughness:0.3,metalness:0.05,transparent:true,opacity:0.45,depthWrite:false});
const matGhost=new THREE.MeshStandardMaterial({color:'#B8C876',roughness:0.3,metalness:0.05,transparent:true,opacity:0.4,depthWrite:false});
const matHover=new THREE.MeshStandardMaterial({color:'#ff5c5c',roughness:0.45,emissive:'#ff2222',emissiveIntensity:0.3});

// ═══════════════════════════════════
//  STATE
// ═══════════════════════════════════
const grid=new GridMath(0.5);
let mode='build';
let tool='drawWall';
let walls=[],windows=[],pillars=[],doors=[],furniture=[];
let foundationMesh=null,floorMesh=null,ceilingMesh=null,roofGroup=null;
let interiorPanels=[],baseboards=[],gardenGroup=null;
let roofType='flat';
let previewObj=null,wallStart=null,drawActive=false,lastWallEnd=null;
let undoStack=[];
const endpoints=[];

const raycaster=new THREE.Raycaster();
const mouseV=new THREE.Vector2();
const groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);
const snapDot=document.getElementById('snapDot');
const infoBar=document.getElementById('infoBar');

// ═══════════════════════════════════
//  WALL GEOMETRY
// ═══════════════════════════════════
function createWallGeom(sx,sz,ex,ez,h,mat){
  const dx=ex-sx,dz=ez-sz,len=Math.hypot(dx,dz);
  if(len<0.2)return null;
  const shape=new THREE.Shape();
  const hw=WALL_T/2;
  shape.moveTo(-hw,0);shape.lineTo(hw,0);shape.lineTo(hw,h);shape.lineTo(-hw,h);shape.closePath();
  const geo=new THREE.ExtrudeGeometry(shape,{steps:1,depth:len,bevelEnabled:false});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.set(sx,0,sz);
  mesh.rotation.y=Math.atan2(dx,dz);
  mesh.castShadow=true;mesh.receiveShadow=true;
  mesh.userData={isWall:true,startX:sx,startZ:sz,endX:ex,endZ:ez,length:len};
  return mesh;
}

function getGround(ev){
  mouseV.x=(ev.clientX/window.innerWidth)*2-1;
  mouseV.y=-(ev.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouseV,camera);
  const t=new THREE.Vector3();
  return raycaster.ray.intersectPlane(groundPlane,t)?t:null;
}

function toScreen(wx,wz){
  const v=new THREE.Vector3(wx,0,wz).project(camera);
  return{x:(v.x*0.5+0.5)*window.innerWidth,y:(-v.y*0.5+0.5)*window.innerHeight};
}

// ═══════════════════════════════════
//  FOUNDATION / FLOOR / ROOF
// ═══════════════════════════════════
function bounds(){
  let mnX=Infinity,mxX=-Infinity,mnZ=Infinity,mxZ=-Infinity;
  walls.forEach(w=>{const d=w.userData;mnX=Math.min(mnX,d.startX,d.endX);mxX=Math.max(mxX,d.startX,d.endX);mnZ=Math.min(mnZ,d.startZ,d.endZ);mxZ=Math.max(mxZ,d.startZ,d.endZ);});
  return{mnX,mxX,mnZ,mxZ};
}
function cx(){const b=bounds();return(b.mnX+b.mxX)/2;}
function cz(){const b=bounds();return(b.mnZ+b.mxZ)/2;}

// ── Compute interior-facing normal for a wall ──
function interiorNormal(d, centerX, centerZ) {
  const dx = d.endX - d.startX, dz = d.endZ - d.startZ;
  const len = Math.hypot(dx, dz);
  if (len < 0.01) return { nx: 0, nz: 0 };
  // Perpendicular: (-dz/len, dx/len)
  const perpX = -dz / len, perpZ = dx / len;
  const midX = (d.startX + d.endX) / 2, midZ = (d.startZ + d.endZ) / 2;
  const toCenterX = centerX - midX, toCenterZ = centerZ - midZ;
  const dot = perpX * toCenterX + perpZ * toCenterZ;
  const sign = dot > 0 ? 1 : -1;
  return { nx: perpX * sign, nz: perpZ * sign };
}

function addFoundation(){
  if(foundationMesh){scene.remove(foundationMesh);foundationMesh.geometry?.dispose();foundationMesh=null;}
  if(!walls.length)return;
  const b=bounds();const fw=b.mxX-b.mnX+WALL_T+0.2,fd=b.mxZ-b.mnZ+WALL_T+0.2;
  if(fw<1||fd<1)return;
  foundationMesh=new THREE.Mesh(new THREE.BoxGeometry(fw,0.18,fd),matFoundation);
  foundationMesh.position.set(cx(),0.09,cz());foundationMesh.receiveShadow=true;
  foundationMesh.userData={isFoundation:true};scene.add(foundationMesh);
}

function addFloor(){
  if(floorMesh){scene.remove(floorMesh);floorMesh.geometry?.dispose();floorMesh=null;}
  if(!walls.length)return;
  const b=bounds();const fw=b.mxX-b.mnX,fd=b.mxZ-b.mnZ;
  if(fw<0.5||fd<0.5)return;
  // Rich hardwood floor with subtle plank lines
  const floorGroup = new THREE.Group();
  const mainFloor = new THREE.Mesh(new THREE.PlaneGeometry(fw, fd), matFloor);
  mainFloor.rotation.x = -Math.PI/2;
  mainFloor.receiveShadow = true;
  floorGroup.add(mainFloor);

  // Subtle plank grooves (very thin lines)
  const plankMat = new THREE.MeshBasicMaterial({color:'#b8956e',transparent:true,opacity:0.15});
  const plankSpacing = 0.15;
  const numPlanks = Math.floor(fd / plankSpacing);
  for (let i = 0; i < numPlanks; i++) {
    const z = -fd/2 + (i + 0.5) * plankSpacing;
    const groove = new THREE.Mesh(new THREE.PlaneGeometry(fw - 0.04, 0.012), plankMat);
    groove.rotation.x = -Math.PI/2;
    groove.position.set(0, 0.003, z);
    groove.receiveShadow = true;
    floorGroup.add(groove);
  }

  floorGroup.position.set(cx(), 0.19, cz());
  floorGroup.userData = { isFloor: true };
  scene.add(floorGroup);
  floorMesh = floorGroup;
}

function addFlatCeiling(){
  if(ceilingMesh){scene.remove(ceilingMesh);ceilingMesh=null;}
  if(!walls.length)return;
  const b=bounds();const cw=b.mxX-b.mnX+WALL_T+EAVE*2,cd=b.mxZ-b.mnZ+WALL_T+EAVE*2;
  if(cw<1||cd<1)return;
  const g=new THREE.Group();

  // Main ceiling slab — white
  const slab=new THREE.Mesh(new THREE.BoxGeometry(cw,0.12,cd),matCeiling);
  slab.position.y=WALL_H;slab.receiveShadow=true;g.add(slab);

  // Subtle exposed beams (decorative)
  const beamH = 0.08, beamW = 0.1;
  const beamSpan = 1.2;
  const numBeams = Math.max(2, Math.floor(cw / beamSpan));
  for (let i = 0; i < numBeams; i++) {
    const x = -cw/2 + (i + 0.5) * (cw / numBeams);
    const beam = new THREE.Mesh(new THREE.BoxGeometry(beamW, beamH, cd + 0.04), matCeilingBeam);
    beam.position.set(x, WALL_H + 0.06 + beamH/2, 0);
    beam.castShadow = true; beam.receiveShadow = true;
    g.add(beam);
  }

  // Eave trim
  const th=0.1,tw=0.12;
  const ft=new THREE.Mesh(new THREE.BoxGeometry(cw+tw,th,tw),matTrim);ft.position.set(0,WALL_H+0.15+th/2,cd/2+tw/2);g.add(ft);
  const bt=new THREE.Mesh(new THREE.BoxGeometry(cw+tw,th,tw),matTrim);bt.position.set(0,WALL_H+0.15+th/2,-cd/2-tw/2);g.add(bt);
  const lt=new THREE.Mesh(new THREE.BoxGeometry(tw,th,cd),matTrim);lt.position.set(-cw/2-tw/2,WALL_H+0.15+th/2,0);g.add(lt);
  const rt=new THREE.Mesh(new THREE.BoxGeometry(tw,th,cd),matTrim);rt.position.set(cw/2+tw/2,WALL_H+0.15+th/2,0);g.add(rt);

  g.position.set(cx(),0,cz());g.userData={isCeiling:true};scene.add(g);ceilingMesh=g;
}

function addGableRoof(){
  if(roofGroup){scene.remove(roofGroup);roofGroup=null;}
  if(!walls.length)return;
  const b=bounds();const rw=b.mxX-b.mnX+WALL_T+EAVE*2,rd=b.mxZ-b.mnZ+WALL_T+EAVE*2;
  if(rw<1||rd<1)return;
  const g=new THREE.Group();
  const ridgeH=1.5;

  const shape=new THREE.Shape();shape.moveTo(-rw/2,0);shape.lineTo(rw/2,0);shape.lineTo(0,ridgeH);shape.closePath();
  const roofGeo=new THREE.ExtrudeGeometry(shape,{steps:1,depth:rd,bevelEnabled:false});
  const roof=new THREE.Mesh(roofGeo,matRoofTile);
  roof.position.set(0,WALL_H,-rd/2);roof.castShadow=roof.receiveShadow=true;g.add(roof);

  // Ceiling under the gable (visible from inside) — white
  const underCeil = new THREE.Mesh(new THREE.PlaneGeometry(rw - WALL_T, rd - WALL_T), matCeiling);
  underCeil.rotation.x = -Math.PI/2;
  underCeil.position.y = WALL_H - 0.01;
  underCeil.receiveShadow = true;
  g.add(underCeil);

  const ridge=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.08,rd+0.1),matTrim);
  ridge.position.set(0,WALL_H+ridgeH,0);g.add(ridge);

  const etH=0.07,etW=0.13;
  const fe=new THREE.Mesh(new THREE.BoxGeometry(rw+etW*2,etH,etW),matEave);fe.position.set(0,WALL_H,rd/2+etW/2);g.add(fe);
  const be=new THREE.Mesh(new THREE.BoxGeometry(rw+etW*2,etH,etW),matEave);be.position.set(0,WALL_H,-rd/2-etW/2);g.add(be);
  const le=new THREE.Mesh(new THREE.BoxGeometry(etW,etH,rd),matEave);le.position.set(-rw/2-etW/2,WALL_H,0);g.add(le);
  const re=new THREE.Mesh(new THREE.BoxGeometry(etW,etH,rd),matEave);re.position.set(rw/2+etW/2,WALL_H,0);g.add(re);

  const chW=0.28,chD=0.28,chH=1.0;
  const chimney=new THREE.Mesh(new THREE.BoxGeometry(chW,chH,chD),matChimney);
  chimney.position.set(rw*0.22,WALL_H+ridgeH*0.35+chH/2,rd*0.18);
  chimney.castShadow=true;g.add(chimney);
  const chCap=new THREE.Mesh(new THREE.BoxGeometry(chW+0.06,0.06,chD+0.06),matTrim);
  chCap.position.copy(chimney.position);chCap.position.y+=chH/2+0.03;g.add(chCap);

  g.position.set(cx(),0,cz());
  g.userData={isRoof:true};
  scene.add(g);roofGroup=g;
}

function applyRoof(){if(roofType==='flat'){if(roofGroup){scene.remove(roofGroup);roofGroup=null;}addFlatCeiling();}else{if(ceilingMesh){scene.remove(ceilingMesh);ceilingMesh=null;}addGableRoof();}}

function addPillars(){
  pillars.forEach(p=>{scene.remove(p);p.geometry?.dispose();});pillars=[];
  if(!walls.length)return;
  const pts=new Map();
  walls.forEach(w=>{const d=w.userData;pts.set(d.startX+','+d.startZ,{x:d.startX,z:d.startZ});pts.set(d.endX+','+d.endZ,{x:d.endX,z:d.endZ});});
  const PS=WALL_T+0.06;
  pts.forEach(p=>{const geo=new THREE.BoxGeometry(PS,WALL_H,PS);const mesh=new THREE.Mesh(geo,matPillar);mesh.position.set(p.x,WALL_H/2,p.z);mesh.castShadow=mesh.receiveShadow=true;mesh.userData={isPillar:true};scene.add(mesh);pillars.push(mesh);});
}

// ═══════════════════════════════════
//  INTERIOR PANELS + BASEBOARDS
// ═══════════════════════════════════
function addInteriorDetails(){
  // Clean previous
  interiorPanels.forEach(p=>{scene.remove(p);if(p.geometry)p.geometry.dispose();});
  interiorPanels=[];
  baseboards.forEach(b=>{scene.remove(b);if(b.geometry)b.geometry.dispose();});
  baseboards=[];

  if(!walls.length)return;
  const b=bounds();
  const centerX=(b.mnX+b.mxX)/2, centerZ=(b.mnZ+b.mxZ)/2;

  walls.forEach(w=>{
    const d=w.userData;
    const {nx, nz} = interiorNormal(d, centerX, centerZ);
    if (Math.abs(nx) < 0.001 && Math.abs(nz) < 0.001) return;

    const midX = (d.startX + d.endX) / 2, midZ = (d.startZ + d.endZ) / 2;
    const dx = d.endX - d.startX, dz = d.endZ - d.startZ;
    const len = Math.hypot(dx, dz);
    const angle = Math.atan2(dx, dz);

    // ── Interior wall panel (thin cream face) ──
    const panelGeo = new THREE.PlaneGeometry(len - 0.04, WALL_H - 0.02);
    const panel = new THREE.Mesh(panelGeo, matWallInner);
    panel.position.set(midX + nx * (WALL_T/2 - 0.01), WALL_H/2, midZ + nz * (WALL_T/2 - 0.01));
    panel.rotation.y = angle;
    panel.receiveShadow = true;
    panel.userData = { isInteriorPanel: true };
    scene.add(panel);
    interiorPanels.push(panel);

    // ── Baseboard (white skirting) ──
    const bbH = 0.12, bbD = 0.03;
    const bbGeo = new THREE.BoxGeometry(len, bbH, bbD);
    const bb = new THREE.Mesh(bbGeo, matBaseboard);
    bb.position.set(midX + nx * (WALL_T/2 + bbD/2), bbH/2, midZ + nz * (WALL_T/2 + bbD/2));
    bb.rotation.y = angle;
    bb.receiveShadow = true; bb.castShadow = true;
    bb.userData = { isBaseboard: true };
    scene.add(bb);
    baseboards.push(bb);
  });
}

// ═══════════════════════════════════
//  REBUILD ALL
// ═══════════════════════════════════
function rebuildAll(){
  if(foundationMesh){scene.remove(foundationMesh);foundationMesh.geometry?.dispose();foundationMesh=null;}
  if(floorMesh){scene.remove(floorMesh);/* group — dispose children */floorMesh=null;}
  if(ceilingMesh){scene.remove(ceilingMesh);ceilingMesh=null;}
  if(roofGroup){scene.remove(roofGroup);roofGroup=null;}
  pillars.forEach(p=>{scene.remove(p);p.geometry?.dispose();});pillars=[];
  interiorPanels.forEach(p=>{scene.remove(p);if(p.geometry)p.geometry.dispose();});interiorPanels=[];
  baseboards.forEach(b=>{scene.remove(b);if(b.geometry)b.geometry.dispose();});baseboards=[];

  const toRemove=[];
  scene.children.forEach(c=>{if(c.userData&&(c.userData.isBase||c.userData.isPath||c.userData.isShutter))toRemove.push(c);});
  toRemove.forEach(c=>scene.remove(c));

  addFoundation();addFloor();applyRoof();addPillars();
  addInteriorDetails(); // ★ Interior panels + baseboards

  // Wall base trim — dark band at bottom of each exterior wall
  walls.forEach(w=>{
    const d=w.userData;const dx=d.endX-d.startX,dz=d.endZ-d.startZ,len=Math.hypot(dx,dz);
    const geo=new THREE.BoxGeometry(len+0.02,0.25,WALL_T+0.04);
    const trim=new THREE.Mesh(geo,matWallBase);
    trim.position.set((d.startX+d.endX)/2,0.125,(d.startZ+d.endZ)/2);
    trim.rotation.y=Math.atan2(dx,dz);
    trim.receiveShadow=true;trim.userData={isBase:true};scene.add(trim);
  });

  // Pathway
  if(doors.length){
    const dd=doors[0].position;const fwd=new THREE.Vector3(0,0,-1);
    fwd.applyQuaternion(doors[0].quaternion);
    const plen=2.5;const pw=1.0;
    const pathGeo=new THREE.PlaneGeometry(pw,plen);
    const path=new THREE.Mesh(pathGeo,matPath);
    path.rotation.x=-Math.PI/2;
    path.position.set(dd.x+fwd.x*plen/2,0.005,dd.z+fwd.z*plen/2);
    path.receiveShadow=true;path.userData={isPath:true};scene.add(path);
  }

  addGarden();

  endpoints.length=0;
  walls.forEach(w=>{const d=w.userData;endpoints.push({x:d.startX,z:d.startZ},{x:d.endX,z:d.endZ});});
  updateCounts();
}

const matWater=new THREE.MeshStandardMaterial({color:'#4a90d9',roughness:0.15,metalness:0.3,transparent:true,opacity:0.75});
const matPoolEdge=new THREE.MeshStandardMaterial({color:'#d4cfc4',roughness:0.4});
const matHedge=new THREE.MeshStandardMaterial({color:'#3d5a1e',roughness:0.7});
const matTreeTrunk=new THREE.MeshStandardMaterial({color:'#6b4a30',roughness:0.7});
const matTreeLeaves=new THREE.MeshStandardMaterial({color:'#3a6b25',roughness:0.75});
const matDeck=new THREE.MeshStandardMaterial({color:'#b8956e',roughness:0.55});
const matFence=new THREE.MeshStandardMaterial({color:'#e8e0d5',roughness:0.5});

function addTree(x,z,s=1){
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.08*s,0.12*s,1.8*s,8),matTreeTrunk);
  trunk.position.y=0.9*s;trunk.castShadow=true;g.add(trunk);
  const leaves1=new THREE.Mesh(new THREE.ConeGeometry(0.7*s,1.3*s,8),matTreeLeaves);
  leaves1.position.y=2.0*s;leaves1.castShadow=true;g.add(leaves1);
  const leaves2=new THREE.Mesh(new THREE.ConeGeometry(0.55*s,1.1*s,8),matTreeLeaves);
  leaves2.position.y=2.8*s;leaves2.castShadow=true;g.add(leaves2);
  g.position.set(x,0,z);return g;
}

function addGarden(){
  if(gardenGroup){scene.remove(gardenGroup);gardenGroup=null;}
  if(!walls.length)return;
  const b=bounds();
  const g=new THREE.Group();

  const poolW=3.5,poolD=2.0,poolH=0.5;
  const poolX=b.mxX+2.5,poolZ=cz();
  const poolBody=new THREE.Mesh(new THREE.BoxGeometry(poolW,poolH,poolD),matWater);
  poolBody.position.set(poolX,poolH/2-0.05,poolZ);poolBody.receiveShadow=true;g.add(poolBody);
  const edgeT=0.12,edgeH=0.1;
  const makeEdge=(w,d,x,z)=>{const e=new THREE.Mesh(new THREE.BoxGeometry(w,edgeH,d),matPoolEdge);e.position.set(x,0.1,z);e.receiveShadow=true;return e;};
  g.add(makeEdge(poolW+edgeT*2,edgeT,poolX,poolZ+poolD/2+edgeT/2));
  g.add(makeEdge(poolW+edgeT*2,edgeT,poolX,poolZ-poolD/2-edgeT/2));
  g.add(makeEdge(edgeT,poolD,poolX+poolW/2+edgeT/2,poolZ));
  g.add(makeEdge(edgeT,poolD,poolX-poolW/2-edgeT/2,poolZ));

  const deckW=Math.min(4,b.mxX-b.mnX+1),deckD=2.5;
  const deckX=(b.mnX+b.mxX)/2,deckZ=b.mxZ+1.8;
  const deck=new THREE.Mesh(new THREE.BoxGeometry(deckW,0.08,deckD),matDeck);
  deck.position.set(deckX,0.06,deckZ);deck.receiveShadow=true;g.add(deck);
  for(let i=0;i<5;i++){
    const plank=new THREE.Mesh(new THREE.BoxGeometry(deckW-0.1,0.005,0.04),matTrim);
    plank.position.set(deckX,0.1,deckZ-deckD/2+(i+1)*deckD/6);g.add(plank);
  }

  const hx=b.mnX-0.8,hz=b.mnZ-0.8,hw=b.mxX-b.mnX+1.6,hd=b.mxZ-b.mnZ+1.6;
  const makeHedge=(w,d,x,z)=>{const h=new THREE.Mesh(new THREE.BoxGeometry(w,0.5,d),matHedge);h.position.set(x,0.25,z);h.castShadow=h.receiveShadow=true;return h;};
  g.add(makeHedge(hw,0.25,(b.mnX+b.mxX)/2,b.mnZ-0.8));
  g.add(makeHedge(hw,0.25,(b.mnX+b.mxX)/2,b.mxZ+0.8));
  g.add(makeHedge(0.25,hd,b.mnX-0.8,(b.mnZ+b.mxZ)/2));
  g.add(makeHedge(0.25,hd-1.6,b.mxX+0.8,(b.mnZ+b.mxZ)/2+0.8));
  g.add(makeHedge(0.25,hd-1.6,b.mxX+0.8,(b.mnZ+b.mxZ)/2-0.8));

  g.add(addTree(b.mnX-2,b.mnZ-1.5,1.0));
  g.add(addTree(b.mxX+2,b.mxZ+2,0.85));
  g.add(addTree(b.mnX-1.5,b.mxZ+2,0.9));
  g.add(addTree(b.mxX+2.5,b.mnZ-2,0.75));

  for(let i=0;i<Math.floor(hw/1.5);i++){
    const post=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.05,0.7,6),matFence);
    post.position.set(b.mnX-0.8+i*1.5,0.35,b.mnZ-1.1);
    post.castShadow=true;g.add(post);
  }

  scene.add(g);gardenGroup=g;
}

  const bb=bounds();const sp=Math.max(bb.mxX-bb.mnX,bb.mxZ-bb.mnZ);

  orbit.target.set((bb.mnX+bb.mxX)/2,0,(bb.mnZ+bb.mxZ)/2);orbit.update();
  document.querySelectorAll('.side-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('btnOrbit').classList.add('active');
  tool='orbit';mode='';canvas.classList.add('placing');
  infoBar.innerHTML='Template: <span class="text-[#B8C876] font-bold">'+name+'</span> &bull; '+walls.length+' walls &bull; '+windows.length+' windows &bull; '+doors.length+' doors';
  updateCounts();
}
function updateCounts(){
  document.getElementById('wallCount').textContent=walls.length+' walls';
  document.getElementById('btnUndo').disabled=undoStack.length===0;
}

// ═══════════════════════════════════
//  WALL SNAPPING (window/door)
// ═══════════════════════════════════
function snapToWall(pt){
  if(!walls.length)return null;
  mouseV.x=(pt.x/window.innerWidth)*2-1;
  mouseV.y=-(pt.y/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouseV,camera);
  const hits=raycaster.intersectObjects(walls);
  if(!hits.length)return null;
  const hit=hits[0];
  const w=hit.object;if(!w.userData.isWall)return null;
  const hp=hit.point;
  const d=w.userData;
  const dx=d.endX-d.startX,dz=d.endZ-d.startZ;
  const len=Math.hypot(dx,dz);
  const ux=dx/len,uz=dz/len;
  const t=((hp.x-d.startX)*ux+(hp.z-d.startZ)*uz)/len;
  const clampedT=Math.max(0.15,Math.min(0.85,t));
  const wx=d.startX+dx*clampedT,wz=d.startZ+dz*clampedT;
  const angle=Math.atan2(dx,dz);
  const nx=Math.sin(angle)*(WALL_T/2+0.02),nz=Math.cos(angle)*(WALL_T/2+0.02);
  return{x:wx+nx,z:wz+nz,angle};
}

//  GHOST PREVIEW
// ═══════════════════════════════════
function createGhost(mesh){
  if(previewObj){scene.remove(previewObj);previewObj=null;}
  if(!mesh)return;
  mesh.traverse(c=>{if(c.isMesh){c.material=Array.isArray(c.material)?c.material.map(()=>matGhost):matGhost;c.renderOrder=999;}});
  mesh.renderOrder=999;
  previewObj=mesh;scene.add(previewObj);
}

canvas.addEventListener('pointerdown',ev=>{
  if(ev.button!==0)return;
  const pt=getGround(ev);

  if(tool==='drawWall'&&mode==='build'){
    if(!pt)return;
    let x=grid.snap(pt.x),z=grid.snap(pt.z);
    if(!drawActive){
      const sp=grid.nearest(x,z,endpoints);
      if(sp){x=sp.x;z=sp.z;}
      wallStart={x,z};drawActive=true;lastWallEnd=wallStart;
      infoBar.innerHTML='Drawing wall — <span class="text-[#B8C876] font-bold">click</span> to finish &bull; <span class="text-[#B8C876] font-bold">Shift</span>=snap 90°';
    }else{
      if(ev.shiftKey){const s=grid.snap90(lastWallEnd.x,lastWallEnd.z,x,z);x=s.x;z=s.z;}
      const sp=grid.nearest(x,z,endpoints);if(sp){x=sp.x;z=sp.z;}
      if(x===lastWallEnd.x&&z===lastWallEnd.z){drawActive=false;clearPreview();return;}
      const wall=createWallGeom(lastWallEnd.x,lastWallEnd.z,x,z,WALL_H,matWall);
      if(wall){scene.add(wall);walls.push(wall);undoStack.push(wall);}
      lastWallEnd={x,z};wallStart=null;clearPreview();drawActive=false;rebuildAll();
      infoBar.innerHTML='Click to <span class="text-[#B8C876] font-bold">start next wall</span> &bull; Walls: <span class="text-[#B8C876] font-bold">'+walls.length+'</span>';
    }
    return;
  }

  if(tool==='window'&&mode==='build'){
    const snapped=snapToWall({x:ev.clientX,y:ev.clientY});
    if(snapped){
      const win=createWindowAsset();win.position.set(snapped.x,0,snapped.z);win.rotation.y=snapped.angle;
      scene.add(win);windows.push(win);undoStack.push(win);
      infoBar.innerHTML='Window placed &bull; Windows: <span class="text-[#B8C876] font-bold">'+windows.length+'</span>';
    }else if(pt){
      const s=grid.snapV3(pt);
      const win=createWindowAsset();win.position.copy(s);
      scene.add(win);windows.push(win);undoStack.push(win);
      infoBar.innerHTML='Window placed on ground &bull; Click near a <span class="text-[#B8C876] font-bold">wall</span> to snap';
    }
    return;
  }

  if(tool==='door'&&mode==='build'){
    const snapped=snapToWall({x:ev.clientX,y:ev.clientY});
    if(snapped){
      const dr=createDoorAsset();dr.position.set(snapped.x,0,snapped.z);dr.rotation.y=snapped.angle;
      scene.add(dr);doors.push(dr);undoStack.push(dr);
      infoBar.innerHTML='Door placed &bull; Doors: <span class="text-[#B8C876] font-bold">'+doors.length+'</span>';
    }else if(pt){
      const s=grid.snapV3(pt);
      const dr=createDoorAsset();dr.position.copy(s);
      scene.add(dr);doors.push(dr);undoStack.push(dr);
      infoBar.innerHTML='Door placed on ground &bull; Click near a <span class="text-[#B8C876] font-bold">wall</span> to snap';
    }
    return;
  }

  // Furnish mode
  if(mode==='furnish'&&furnitureCatalog[tool]&&pt){
    const s=grid.snapV3(pt);
    const item=cloneFurniture(tool);if(!item)return;
    item.position.copy(s);scene.add(item);furniture.push(item);undoStack.push(item);
    infoBar.innerHTML='Placed <span class="text-[#B8C876] font-bold">'+tool+'</span> at ('+s.x.toFixed(1)+', '+s.z.toFixed(1)+') &bull; Items: <span class="text-[#B8C876] font-bold">'+furniture.length+'</span>';
    return;
  }

  if(tool==='roof'&&mode==='build'){
    roofType=roofType==='flat'?'gable':'flat';
    applyRoof();
    infoBar.innerHTML='Roof: <span class="text-[#B8C876] font-bold">'+roofType+'</span> &bull; Click again to toggle';
    return;
  }
});

    let x=grid.snap(pt.x),z=grid.snap(pt.z);
    const sp=grid.nearest(x,z,endpoints);
    const isSnap=!!sp;if(sp){x=sp.x;z=sp.z;}
    const sc=toScreen(x,z);snapDot.style.left=sc.x+'px';snapDot.style.top=sc.y+'px';snapDot.style.display='block';
    snapDot.style.width=isSnap?'18px':'12px';snapDot.style.height=isSnap?'18px':'12px';
    snapDot.style.background=isSnap?'rgba(184,200,118,0.95)':'rgba(184,200,118,0.4)';
    if(drawActive&&lastWallEnd){
      let px=x,pz=z;if(ev.shiftKey){const s=grid.snap90(lastWallEnd.x,lastWallEnd.z,x,z);px=s.x;pz=s.z;}
      clearPreview();
      const pw=createWallGeom(lastWallEnd.x,lastWallEnd.z,px,pz,WALL_H,matPreview);
      if(pw){pw.renderOrder=999;previewObj=pw;scene.add(previewObj);}
    }
    return;
  }
  if((tool==='window'||tool==='door')&&mode==='build'){
    snapDot.style.left=ev.clientX+'px';snapDot.style.top=ev.clientY+'px';snapDot.style.display='block';
    snapDot.style.width='14px';snapDot.style.height='14px';snapDot.style.background='rgba(184,200,118,0.7)';
    return;
  }
  // Furnish ghost preview
  if(mode==='furnish'&&furnitureCatalog[tool]){
    const pt=getGround(ev);if(!pt)return;
    const s=grid.snapV3(pt);
    if(!previewObj||previewObj.userData?.asset!==tool){clearPreview();const g=cloneFurniture(tool);if(g){g.traverse(c=>{if(c.isMesh){c.material=matGhost;c.renderOrder=999;}});g.renderOrder=999;previewObj=g;scene.add(previewObj);}}
    if(previewObj)previewObj.position.copy(s);
    snapDot.style.left=ev.clientX+'px';snapDot.style.top=ev.clientY+'px';snapDot.style.display='block';
    return;
  }
  clearPreview();
});

window.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){
    if(tourActive){stopTour();return;}
    drawActive=false;clearPreview();wallStart=null;lastWallEnd=null;snapDot.style.display='none';
    infoBar.innerHTML='Cancelled. Click <span class="text-[#B8C876] font-bold">Draw Wall</span> to start';
  }
  if(ev.key==='t'||ev.key==='T'){
    if(tourActive){stopTour();}else{startTour();}
  }
});

// ═══════════════════════════════════
//  UI BUTTONS
// ═══════════════════════════════════
document.querySelectorAll('.side-btn[data-tool]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const t=btn.dataset.tool;const m=btn.dataset.mode||'orbit';
    tool=t;mode=m;
    drawActive=false;clearPreview();wallStart=null;lastWallEnd=null;snapDot.style.display='none';
    canvas.classList.toggle('placing',t!=='orbit');
    orbit.mouseButtons.LEFT=(t==='orbit')?THREE.MOUSE.ROTATE:null;
    orbit.mouseButtons.RIGHT=(t==='orbit')?null:THREE.MOUSE.ROTATE;

    document.querySelectorAll('.side-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');

    if(t==='drawWall')infoBar.innerHTML='Click <span class="text-[#B8C876] font-bold">ground</span> to start wall &bull; <span class="text-[#B8C876] font-bold">Shift</span>=snap 90° &bull; <span class="text-[#B8C876] font-bold">Esc</span>=cancel';
    else if(t==='roof'){
      roofType=roofType==='flat'?'gable':'flat';
      applyRoof();
      infoBar.innerHTML='Roof toggled: <span class="text-[#B8C876] font-bold">'+roofType+'</span> &bull; Click again to switch';
    }
    else if(t==='window')infoBar.innerHTML='Click <span class="text-[#B8C876] font-bold">on a wall</span> to snap window &bull; or ground for free placement';
    else if(t==='door')infoBar.innerHTML='Click <span class="text-[#B8C876] font-bold">on a wall</span> to snap door &bull; or ground for free placement';
    else if(m==='furnish')infoBar.innerHTML='Click <span class="text-[#B8C876] font-bold">ground</span> to place <span class="text-[#B8C876] font-bold">'+t+'</span> &bull; Snaps to 0.5m grid';
    else infoBar.innerHTML='<span class="text-[#B8C876] font-bold">Left+drag</span> orbit &bull; <span class="text-[#B8C876] font-bold">Scroll</span> zoom &bull; Walls: <span class="text-[#B8C876] font-bold">'+walls.length+'</span>';
  });
});

document.getElementById('btnUndo').addEventListener('click',()=>{
  const item=undoStack.pop();if(!item)return;
  scene.remove(item);
  if(item.userData.isWall){const i=walls.indexOf(item);if(i!==-1)walls.splice(i,1);rebuildAll();}
  else if(item.userData.isWindow){const i=windows.indexOf(item);if(i!==-1)windows.splice(i,1);}
  else if(item.userData.isDoor){const i=doors.indexOf(item);if(i!==-1)doors.splice(i,1);}
  else{const i=furniture.indexOf(item);if(i!==-1)furniture.splice(i,1);}
  updateCounts();
  infoBar.innerHTML='Undo &bull; Walls: <span class="text-[#B8C876] font-bold">'+walls.length+'</span>';
});

document.getElementById('btnClear').addEventListener('click',()=>{
  [...walls,...windows,...doors,...furniture].forEach(o=>{scene.remove(o);});
  walls=[];windows=[];doors=[];furniture=[];pillars=[];undoStack=[];
  interiorPanels.forEach(p=>{scene.remove(p);});interiorPanels=[];
  baseboards.forEach(b=>{scene.remove(b);});baseboards=[];
  if(foundationMesh){scene.remove(foundationMesh);foundationMesh=null;}
  if(floorMesh){scene.remove(floorMesh);floorMesh=null;}
  if(ceilingMesh){scene.remove(ceilingMesh);ceilingMesh=null;}
  if(roofGroup){scene.remove(roofGroup);roofGroup=null;}
  clearPreview();drawActive=false;wallStart=null;lastWallEnd=null;
  endpoints.length=0;updateCounts();
  infoBar.innerHTML='Cleared. Click <span class="text-[#B8C876] font-bold">Draw Wall</span> to start';
});

document.getElementById('btnExport').addEventListener('click',()=>{
  if(!walls.length){infoBar.innerHTML='<span class="text-[#B8C876] font-bold">Nothing to export!</span>';return;}
  import('three/addons/exporters/GLTFExporter.js').then(({GLTFExporter})=>{
    new GLTFExporter().parse(scene,gltf=>{
      const b=new Blob([gltf],{type:'application/octet-stream'});
      const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='instabuild.glb';a.click();
    },null,{binary:true});
  });
  infoBar.innerHTML='Exporting <span class="text-[#B8C876] font-bold">instabuild.glb</span>...';
});

document.getElementById('btnTour').addEventListener('click',()=>{
  if(tourActive){stopTour();}else{startTour();}
});

document.querySelectorAll('.template-btn').forEach(btn=>{
  btn.addEventListener('click',()=>loadTemplate(btn.dataset.template));
});

// ═══════════════════════════════════
//  TWEAKPANE
// ═══════════════════════════════════
try{
  const pane=new Tweakpane.Pane({title:'Settings'});
  const el=pane.element;if(el){el.style.position='fixed';el.style.top='24px';el.style.right='24px';el.style.zIndex='50';}
  const lf=pane.addFolder({title:'Lighting',expanded:false});
  lf.addInput(ambient,'intensity',{min:0,max:3,step:0.1,label:'Ambient'});
  lf.addInput(sun,'intensity',{min:0,max:8,step:0.1,label:'Sun'});
  const bf=pane.addFolder({title:'Build',expanded:false});
  const bp={wallH:WALL_H,gridS:0.5};
  bf.addInput(bp,'wallH',{min:2,max:6,step:0.1,label:'Wall Height'});
  bf.addInput(bp,'gridS',{min:0.25,max:2,step:0.25,label:'Grid Snap'}).on('change',ev=>{grid.size=ev.value;});
  window.__pane=pane;
}catch(e){console.warn('Tweakpane:',e.message);}

// ═══════════════════════════════════
//  RENDER
// ═══════════════════════════════════
let lastTime = performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  if (tourActive) {
    updateTour(dt);
  } else {
    orbit.update();
  }
  renderer.render(scene, camera);
}
animate();
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});
window.__instaBuild={grid,scene,camera,orbit,renderer,walls,windows,doors,furniture,createWallGeom,cloneFurniture,rebuildAll,ambient,sun};
console.log('%c🏗️ InstaBuild %cProfessional %cready','color:#B8C876;font-weight:bold;','color:#fff;','color:#aaa;');
</script>
</body>
